[project]
name = "english-app"
version = "0.1.0"
description = "Local English learning web app with pluggable LLM providers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "alembic>=1.13",
    "pydantic>=2.11",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "claude-agent-sdk>=0.2.180,<0.3",
    "github-copilot-sdk>=1.0.31,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/english_app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["src/english_app/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "copilot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
